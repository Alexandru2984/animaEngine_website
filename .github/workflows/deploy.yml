name: Sync releases and deploy

# Keeps animaengine.eu in step with GitHub Releases of animaEngine and with
# this repository:
#
# - push to main         validate and deploy what was pushed;
# - repository_dispatch  animaEngine published a release (sent by a small
#                        workflow in that repository; see README): sync,
#                        commit the new release data, validate, deploy;
# - schedule             the same every six hours, as a safety net;
# - workflow_dispatch    by hand from the Actions tab: sync and deploy.
#
# A sync that finds nothing new changes no file, so nothing is committed or
# deployed. Nothing is deployed unless `npm run validate` passes.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the animaengine-website Worker

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [animaengine-release]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: sync, validate, deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync release data from GitHub
        if: github.event_name != 'push'
        env:
          # Read-only use: raises the API rate limit for the sync.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run releases:sync

      - name: Type-check, test, build, verify
        run: npm run validate

      - name: Commit new release data
        id: commit
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- src/data/releases.json src/content/changelog)" ]; then
            echo "No new release data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/releases.json src/content/changelog
          git commit -m "Sync release data from GitHub"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
